<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        section {
            width: 100%;
            min-height: 100vh;
            background-color: rgb(231, 231, 231);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            background: linear-gradient(rgb(255, 79, 79), rgb(80, 255, 80));

        }

        section div {
            width: 300px;
            min-height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 30px;
            border: 2px solid white;
            border-radius: 10px;
            background: linear-gradient(rgb(100, 100, 255), rgb(84, 255, 84));
            padding: 10px 10px 0 10px;
        }

        .My-data {
            gap: 5px;
            background: linear-gradient(rgb(84, 255, 84), rgb(100, 100, 255));
            /* display: flex;
            justify-content: center;
            align-items: center; */
            width: 300px;
            border-radius: 10px;
            /* border: 2px solid white; */
        }


        .My-data p {
            text-align: center;
        }

        section div h1 {
            font-size: 30px;
            font-family: Arial, Helvetica, sans-serif;
        }

        section div input {
            width: 250px;
            height: 40px;
            border: none;
            border-radius: 10px;
            color: rgb(0, 0, 0);
            padding: 10px;
            background-color: rgb(216, 216, 216);
            font-size: 16px;
        }

        section div button {
            background-color: blue;
            color: white;
            font-size: 20px;
            padding: 10px 15px;
            border-radius: 10px;

        }
    </style>
</head>

<body>
    <section>
        <div>
            <h1>Weather App</h1>
            <input type="text" id="cityInput" placeholder="Enter city Name">
            <button id="getWeather">Get Weather</button>
            <article id="weatherResult" class="My-data"></article>
        </div>
    </section>
    <script>
        const apiKey = "ea952c257e8c2624a100e2be2acb8d3f"
        const apiURL = "https://api.openweathermap.org/data/2.5/weather"


        document.getElementById("getWeather").addEventListener("click", fetchWeather);

        async function fetchWeather() {
            const city = document.getElementById("cityInput").value.trim()
            if (!city) {
                alert("please enter a city name!")
                return;
            }

            try {
                const response = await fetch(`${apiURL}?q=${city}&appid=${apiKey}&units=metric`);
                const data = await response.json()
                // console.log(data);

                if (data.cod === "404") {
                    document.getElementsById("weatherResult").innerHTML = "City Not Found!"
                    return;
                }
                document.getElementById("weatherResult").innerHTML =
                    `<p> 🌍 City :    <b> ${data.name} </b> </p>
         <p> temperature : <b> ${data.main.temp} </b> </p>
         <p> ☁️ Weather : <b> ${data.weather[0].description}°C </b> </p>
         <p> Humidity :    <b> ${data.main.humidity}% </b> </p>
         <p> speed :    <b> ${data.wind.speed} km/h </b> </p>
        `
                document.getElementById("cityInput").value = ""

            } catch (error) {
                console.error("Error fetching weather:", error)
                document.getElementById("weatherResult").innerHTML = "Failed to load weather."
            }

        }

    </script>
</body>

</html>
