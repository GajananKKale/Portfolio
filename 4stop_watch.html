<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 100%;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(rgb(176, 255, 133), rgb(255, 127, 170));
      }
      section {
        width: 310px;
        min-height: 400px;
        background: linear-gradient(rgb(255, 215, 248), rgb(197, 255, 252));
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        gap: 5px;
        flex-wrap: wrap;
        border-radius: 10px;
        box-shadow: 2px 2px 10px 0.5px black;
        position: relative;
      }
      section h1 {
        position: absolute;
        top: 25px;
        font-size: 35px;
        color: rgb(182, 181, 181);
        text-shadow: 1px 1px 1px red;
      }
      section div:nth-of-type(1) {
        /* border: 1px solid black;s */
        width: 250px;
        height: 80px;
        /* padding: 35px; */
        border-radius: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: rgb(3, 3, 3);
        color: white;
        font-size: 25px;
        flex-direction: row;
        flex-wrap: wrap;
        gap: 10px;
        align-content: center;
      }
      section div:nth-of-type(2) {
        min-width: 250px;
        min-height: 80px;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: row;
        flex-wrap: wrap;
        gap: 10px;
        /* border: 1px solid black; */
      }
      section div:nth-of-type(2) button {
        padding: 10px 15px;
        /* border: 1px solid black; */
        border-radius: 10px;
        cursor: pointer;
        border: none;
      }
      section div:nth-of-type(2) button:hover {
        box-shadow: 1px 1px 6px 0.5px black;
      }
      section div:nth-of-type(2) button:nth-of-type(1) {
        background-color: rgb(10, 132, 255);
        color: white;
        font-size: 15px;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
      }
      section div:nth-of-type(2) button:nth-of-type(2) {
        background-color: rgb(255, 63, 10);
        color: white;
        font-size: 18px;
      }
      section div:nth-of-type(2) button:nth-of-type(3) {
        background-color: rgb(255, 45, 238);
        color: white;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <section>
      <h1>Stopwatch</h1>
      <div id="result"></div>
      <div>
        <button type="button" onclick="start()">Start</button>
        <button type="button" onclick="stop()">Stop</button>
        <button type="button" onclick="resetcount()">Reset</button>
      </div>
    </section>
    <script>
      let result = document.getElementById("result");
      let count = 0;
      let counter;
      let startCount = function () {
        counter = setInterval(() => {
          count++;
          result.textContent = count;
          //   console.log(result);
        }, 100);
      };
      let btns = document.querySelectorAll("button");

      function start() {
        startCount();
        btns[0].disabled = true;
      }
      function stop() {
        clearInterval(counter);
        counter = null;
        btns[0].disabled = false;
      }
      function resetcount() {
        stop();
        count = 0;
        result.textContent = count;
        btns[0].disabled = false;
      }
    </script>
  </body>
</html>
